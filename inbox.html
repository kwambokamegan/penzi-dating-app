<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PENZI Inbox</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #FFF7F0; color: #351A25;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: #8E1B4F; color: #fff; padding: 14px 16px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 17px; margin: 22px 0 10px; color: #8E1B4F; }
  label { display: block; margin: 12px 0 6px; font-weight: 600; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #EAD8D0;
          border-radius: 10px; background: #fff; color: #351A25; }
  button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 10px;
           background: #8E1B4F; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #8E1B4F; border: 1px solid #8E1B4F; }
  button.small { padding: 8px 12px; font-size: 14px; }
  .full { width: 100%; margin-top: 14px; }
  .card { background: #fff; border: 1px solid #EAD8D0; border-radius: 12px;
          padding: 14px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px;
           border: 1px solid #EAD8D0; text-transform: capitalize; }
  .badge.pending { background: #FFF1D6; }
  .badge.accepted { background: #DDF3E4; }
  .badge.expired, .badge.declined { background: #EEE; color: #777; }
  .note { margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: #fff;
          border: 1px solid #EAD8D0; white-space: pre-wrap; }
  .note.bad { border-color: #8E1B4F; color: #8E1B4F; }
  .muted { color: #7a5a66; font-size: 14px; }
  .profile { margin-top: 10px; padding: 10px; background: #FFF7F0;
             border-radius: 8px; white-space: pre-wrap; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .tab { flex: 1; background: #fff; color: #8E1B4F; border: 1px solid #8E1B4F; }
  .tab.active { background: #8E1B4F; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>PENZI</h1>
  <button id="logoutBtn" class="ghost small" hidden>Log out</button>
</header>
<main>
  <section id="loginView" hidden>
    <h2>Log in</h2>
    <label for="phone">Your phone number</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="07XXXXXXXX" autocomplete="tel">

    <div id="pwMode">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="pwBtn" class="full">Log in</button>
      <p><a href="#" id="forgotLink">Forgot password / first time?</a></p>
    </div>

    <div id="codeMode" hidden>
      <button id="sendCodeBtn" class="full">Send me a code</button>
      <div id="codeStep" hidden>
        <label for="code">6-digit code</label>
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
        <label for="newpw">Choose a password (at least 6 characters)</label>
        <input id="newpw" type="password" autocomplete="new-password">
        <button id="setPwBtn" class="full">Save password and log in</button>
      </div>
      <p><a href="#" id="backLink">Back to password login</a></p>
    </div>

    <div id="loginNote" class="note" hidden></div>
  </section>

  <section id="setupView" hidden>
    <h2 id="setupHello">Welcome to PENZI</h2>
    <div id="setupForm">
      <label for="setupPhone">Your phone number</label>
      <input id="setupPhone" type="tel" readonly>
      <label for="setupPw">Choose a password (at least 6 characters)</label>
      <input id="setupPw" type="password" autocomplete="new-password">
      <label for="setupPw2">Enter it again to confirm</label>
      <input id="setupPw2" type="password" autocomplete="new-password">
      <label style="font-weight:400;margin:8px 0;display:block">
        <input type="checkbox" id="setupShow" style="width:auto;margin-right:6px"> Show password
      </label>
      <button id="setupBtn" class="full">Confirm</button>
      <p><a href="#" id="setupHave">I already have a password</a></p>
    </div>
    <div id="setupNote" class="note" hidden></div>
    <button id="loginNowBtn" class="full" hidden>Log in now</button>
  </section>

  <section id="inboxView" hidden>
    <div class="tabs">
      <button id="tabIn" class="tab active">Received</button>
      <button id="tabOut" class="tab">Sent</button>
      <button id="tabResp" class="tab">Responses</button>
    </div>
    <div id="paneIn">
      <h2 id="inTitle">Requests for you</h2>
      <div id="incoming"></div>
      <div style="display:none">
      <h2>Reply</h2>
      <p class="muted">Type YES or NO to answer the newest request, or DESCRIBE 07XXXXXXXX for more details.</p>
      <input id="cmd" type="text" placeholder="Type your reply, e.g. YES" autocomplete="off">
      <button id="cmdBtn" class="full">Send</button>
      </div>
      <div id="inboxNote" class="note" hidden></div>
    </div>
    <div id="paneOut" hidden>
      <h2 id="outTitle">Your requests</h2>
      <div id="outgoing"></div>
    </div>
    <div id="paneResp" hidden>
      <h2>Responses</h2>
      <div id="responses"></div>
      <button id="moreBtn" class="full" style="margin-top:14px">Find more people</button>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, method, body) {
  const res = await fetch(path, {
    method: method,
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return { status: res.status, data: data };
}

function say(id, text, bad) {
  const e = $(id);
  e.textContent = text;
  e.className = "note" + (bad ? " bad" : "");
  e.hidden = false;
  e.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function showView(name) {
  $("loginView").hidden = name !== "login";
  $("inboxView").hidden = name !== "inbox";
  $("logoutBtn").hidden = name !== "inbox";
}

let phone = "";

$("sendCodeBtn").onclick = async () => {
  phone = $("phone").value.trim();
  if (!phone) { say("loginNote", "Please enter your phone number.", true); return; }
  const r = await api("api/login/request", "POST", { phone: phone });
  say("loginNote", r.data.message || r.data.error || "Something went wrong.", r.status !== 200);
  if (r.status === 200) { $("codeStep").hidden = false; $("code").focus(); }
};

$("pwBtn").onclick = async () => {
  phone = $("phone").value.trim();
  const r = await api("api/login/password", "POST", { phone: phone, password: $("pw").value });
  if (r.status !== 200) { say("loginNote", r.data.error || "Login failed.", true); return; }
  $("pw").value = "";
  $("loginNote").hidden = true;
  loadInbox();
};

$("setPwBtn").onclick = async () => {
  phone = $("phone").value.trim();
  const r = await api("api/password/set", "POST", {
    phone: phone, code: $("code").value.trim(), password: $("newpw").value
  });
  if (r.status !== 200) { say("loginNote", r.data.error || "Could not save password.", true); return; }
  $("code").value = "";
  $("newpw").value = "";
  $("loginNote").hidden = true;
  loadInbox();
};

function showMode(which) {
  $("pwMode").hidden = which !== "pw";
  $("codeMode").hidden = which !== "code";
  $("loginNote").hidden = true;
}
$("forgotLink").onclick = (e) => { e.preventDefault(); showMode("code"); };
$("backLink").onclick = (e) => { e.preventDefault(); showMode("pw"); };

$("logoutBtn").onclick = async () => {
  await api("api/logout", "POST");
  $("inboxNote").hidden = true;
  $("codeStep").hidden = true;
  showMode("pw");
  showView("login");
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function person(r) {
  return r.name + ", " + r.age + ", " + r.county;
}

function header(r) {
  const row = el("div", "row");
  row.appendChild(el("strong", "", r.name));
  row.appendChild(el("span", "badge " + r.status, r.status));
  return row;
}

function renderIncoming(list) {
  const box = $("incoming");
  box.innerHTML = "";
  if (!list.length) { box.appendChild(el("p", "muted", "No requests yet.")); return; }
  list.forEach((r) => {
    const card = el("div", "card");
    card.appendChild(header(r));
    card.appendChild(el("p", "", person(r) + " is interested in you."));
    const expired = (r.active === 0 || r.active === false || r.status === "expired");
    const waiting = (r.status === "notified" || r.status === "pending");
    if (waiting && expired) {
      card.appendChild(el("p", "muted", "Expired. This request can no longer be answered."));
    } else if (waiting) {
      const bar = el("div", "row");
      bar.style.gap = "8px";
      bar.style.marginTop = "8px";
      const yes = el("button", "", "YES");
      yes.style.flex = "1";
      yes.onclick = () => respond(r.id, true);
      const no = el("button", "ghost", "NO");
      no.style.flex = "1";
      no.onclick = () => respond(r.id, false);
      bar.appendChild(yes);
      bar.appendChild(no);
      card.appendChild(bar);
    }
    if ((r.status === "accepted" || r.status === "revealed") && r.profile) {
      card.appendChild(el("div", "profile", r.profile));
    }
    box.appendChild(card);
  });
}

function renderOutgoing(list) {
  const box = $("outgoing");
  box.innerHTML = "";
  if (!list.length) { box.appendChild(el("p", "muted", "You have not sent any requests.")); return; }
  list.forEach((r) => {
    const card = el("div", "card");
    card.appendChild(header(r));
    card.appendChild(el("p", "muted", person(r)));
    if (r.status === "accepted" && r.message) {
      card.appendChild(el("div", "profile", r.message));
    }
    box.appendChild(card);
  });
}

function renderResponses(incoming, outgoing) {
  const box = $("responses");
  box.innerHTML = "";
  let any = false;

  (outgoing || []).forEach((r) => {
    if (r.status !== "revealed" && r.status !== "accepted" && r.status !== "declined") { return; }
    any = true;
    const yes = r.status !== "declined";
    const female = /^f/i.test(r.gender || "");
    const card = el("div", "card");
    const row = el("div", "row");
    row.appendChild(el("strong", "", r.name));
    row.appendChild(el("span", "badge " + r.status, yes ? "YES" : "NO"));
    card.appendChild(row);
    if (yes) {
      const num = r.target_phone || r.phone || "";
      let t = r.name + " is also interested in you!";
      if (num) {
        t += " You can contact " + (female ? "her" : "him") + " on " + num + ".";
      }
      t += " Make a move now, and good luck starting your romantic journey!";
      card.appendChild(el("div", "profile", t));
    } else {
      card.appendChild(el("p", "muted", r.name + " is not available right now. Don't give up, there are more people to meet."));
    }
    box.appendChild(card);
  });

  /* RESP3: only the other person's replies */
  if (!any) {
    box.appendChild(el("p", "muted", "No responses yet. When someone replies to a request you sent, you will see it here."));
  }
}

let respIdsNow = [];

function seenList() {
  try { return JSON.parse(localStorage.getItem("seenResp") || "[]"); } catch (e) { return []; }
}

function markSeen() {
  try {
    const all = seenList().concat(respIdsNow);
    localStorage.setItem("seenResp", JSON.stringify(all.slice(-300)));
  } catch (e) {}
  $("tabResp").textContent = "Responses";
}

function updateBadge(outgoing) {
  respIdsNow = (outgoing || [])
    .filter((x) => x.status === "revealed" || x.status === "accepted" || x.status === "declined")
    .map((x) => x.id);
  if (!$("paneResp").hidden) { markSeen(); return; }
  const seen = seenList();
  const n = respIdsNow.filter((id) => seen.indexOf(id) === -1).length;
  $("tabResp").textContent = "Responses" + (n ? " (" + n + ")" : "");
}

async function loadInbox() {
  const r = await api("api/me/interests", "GET");
  if (r.status === 401) { showView("login"); return; }
  const pend = (r.data.incoming || []).filter((x) => x.status === "pending" || x.status === "notified").length;
  $("tabIn").textContent = "Received" + (pend ? " (" + pend + ")" : "");
  renderIncoming(r.data.incoming || []);
  renderOutgoing(r.data.outgoing || []);
  renderResponses(r.data.incoming || [], r.data.outgoing || []);
  updateBadge(r.data.outgoing || []);
  showView("inbox");
}

async function respond(id, accept) {
  const r = await api("api/me/interests/" + id + "/respond", "POST", { accept: accept });
  say("inboxNote", r.data.reply || r.data.error || "Something went wrong.", !r.data.ok);
  loadInbox();
}

async function sendCommand() {
  const text = $("cmd").value.trim();
  if (!text) { return; }
  const r = await api("api/me/command", "POST", { message: text });
  say("inboxNote", r.data.reply || r.data.error || ("Something went wrong (status " + r.status + ")."), r.status !== 200);
  $("cmd").value = "";
  loadInbox();
}
$("cmdBtn").onclick = sendCommand;
$("cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") { sendCommand(); } });

function showTab(which) {
  $("paneIn").hidden = which !== "in";
  $("paneOut").hidden = which !== "out";
  $("paneResp").hidden = which !== "resp";
  if (which === "resp") { markSeen(); }
  $("tabIn").className = "tab" + (which === "in" ? " active" : "");
  $("tabOut").className = "tab" + (which === "out" ? " active" : "");
  $("tabResp").className = "tab" + (which === "resp" ? " active" : "");
}
$("tabIn").onclick = () => showTab("in");
$("tabOut").onclick = () => showTab("out");
$("tabResp").onclick = () => showTab("resp");
$("moreBtn").onclick = () => { location.href = "simulator.html"; };

const qs = new URLSearchParams(location.search);
const setupPhone = qs.get("p") || "";
const setupTok = qs.get("t") || "";

async function startSetup() {
  const r = await api("api/setup/check", "POST", { phone: setupPhone, token: setupTok });
  if (!r.data.ok) { loginFor(setupPhone); return; }
  $("loginView").hidden = true;
  $("inboxView").hidden = true;
  $("setupHello").textContent = "Welcome to PENZI, " + r.data.name + "! Let's set up your password.";
  $("setupPhone").value = r.data.phone;
  $("setupView").hidden = false;
}

$("setupShow").onchange = () => {
  const t = $("setupShow").checked ? "text" : "password";
  $("setupPw").type = t;
  $("setupPw2").type = t;
};

$("setupBtn").onclick = async () => {
  const a = $("setupPw").value;
  const b = $("setupPw2").value;
  if (a.length < 6) { say("setupNote", "Password must be at least 6 characters.", true); return; }
  if (a !== b) { say("setupNote", "The two passwords do not match.", true); return; }
  const r = await api("api/setup/set", "POST", { phone: setupPhone, token: setupTok, password: a });
  if (r.status !== 200) { say("setupNote", r.data.error || "Could not set the password.", true); return; }
  $("setupForm").hidden = true;
  say("setupNote", "Your password has been set up successfully.", false);
  $("loginNowBtn").hidden = false;
};

function goLogin() {
  history.replaceState(null, "", location.pathname);
  $("setupView").hidden = true;
  $("phone").value = $("setupPhone").value;
  $("pw").value = "";
  showMode("pw");
  showView("login");
}
$("loginNowBtn").onclick = goLogin;
$("setupHave").onclick = (e) => { e.preventDefault(); goLogin(); };

async function loginFor(phone) {
  await api("api/logout", "POST", {});
  history.replaceState(null, "", location.pathname);
  $("setupView").hidden = true;
  $("inboxView").hidden = true;
  $("phone").value = phone;
  $("pw").value = "";
  showMode("pw");
  showView("login");
}

if (setupPhone && setupTok) { startSetup(); }
else if (setupPhone) { loginFor(setupPhone); }
else { loadInbox(); }
</script>
</body>
</html>
